<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Subtle Glow -->
  <circle cx="256" cy="256" r="140" fill="#0284C7" opacity="0.15" filter="blur(40px)"/>

  <!-- Logo Mark: Modern Velocity V -->
  <g transform="translate(0, 0)">
    <!-- Left Wing of V (Solid anchor blade) -->
    <polygon points="128,150 196,150 256,336 216,336" fill="url(#indigoGrad)"/>
    
    <!-- Primary Vector Beam (Crossing through vertex) -->
    <polygon points="172,150 228,150 292,342 256,380" fill="url(#cyanGrad)"/>

    <!-- Right Velocity Wing (Ascending chevron blade) -->
    <polygon points="256,380 292,342 384,150 328,150" fill="url(#vectorGrad)"/>

    <!-- Dynamic Forward Velocity Spike (Top Right accelerator) -->
    <polygon points="348,150 396,150 354,236 316,236" fill="#38BDF8" opacity="0.85"/>
  </g>
</svg>